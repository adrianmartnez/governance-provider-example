[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "governance-provider-example"
version = "0.1.0"
description = "Reference third-party provider and reusable template for Governance Provider SDK API 1 (example.catalog)."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
authors = [{ name = "Adrián Martínez Martín" }]
# Host package must provide Provider SDK API 1 (governance.providers / governance.domain /
# governance.conformance). Install published core from the Git tag (see README / CI).
# No PyPI assumption; do not add a direct dependency on the host here.
dependencies = []

[project.urls]
Repository = "https://github.com/adrianmartnez/governance-provider-example"
Documentation = "https://github.com/adrianmartnez/collibra-governance-automation/tree/v2.0.0/docs/providers"
"Core Release" = "https://github.com/adrianmartnez/collibra-governance-automation/releases/tag/v2.0.0"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.entry-points."governance.providers"]
catalog = "governance_provider_example.provider:register"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
