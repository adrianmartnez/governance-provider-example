name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install published core v2.0.0 + build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install "collibra-governance-automation @ git+https://github.com/adrianmartnez/collibra-governance-automation.git@v2.0.0"
          python -m pip install build
          python -c "from importlib import metadata; assert metadata.version('collibra-governance-automation') == '2.0.0'"
          python -c "from governance.providers import PROVIDER_SDK_API_VERSION; assert PROVIDER_SDK_API_VERSION == '1'"
      - name: Build companion wheel
        run: python -m build
      - name: Install companion wheel + pytest
        run: |
          python -m pip install dist/governance_provider_example-*.whl
          python -m pip install pytest>=8.0
          python -c "from importlib import metadata; assert metadata.version('governance-provider-example') == '0.1.0'"
      - name: Conformance
        run: pytest -q
      - name: Discovery + impact smoke
        run: |
          python -c "from governance.providers import discover_providers; p=discover_providers().get('example.catalog'); assert p is not None; assert p.descriptor.provider_id=='example.catalog'; assert p.descriptor.sdk_compatibility=='>=1,<2'; assert {c.value for c in p.descriptor.capabilities}=={'governance_graph','property_observations'}"
          governance impact --config sample/governance.yaml --namespace demo --changes sample/changes.json --output sample/impact-out.json --format json
          python -c "import json; p=json.load(open('sample/impact-out.json',encoding='utf-8')); assert p['result_version']=='1'; assert p['writes_performed']==0; print('status=', p.get('status')); print('writes_performed=', p['writes_performed'])"
